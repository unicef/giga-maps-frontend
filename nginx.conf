server {
      listen       80;
    	server_name  localhost;
    	root   /usr/share/nginx/html;
      index  index.html;

      client_max_body_size 20M;

      # Disable range requests to prevent 206 responses
      max_ranges 0;

      # Vite fingerprints every asset by content, so a name never outlives its
      # bytes. Missing assets must 404 rather than fall through to index.html.
      location /assets/ {
          if ($http_x_forwarded_proto != 'https') {
              return 302 https://$host$request_uri;
          }

          try_files $uri =404;
          add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location / {
          if ($http_x_forwarded_proto != 'https') {
              return 302 https://$host$request_uri;
          }

          try_files $uri /index.html;
          # Cache but always revalidate, so a deploy is visible immediately.
          add_header Cache-Control "no-cache";
      }

      location /metrics {
          proxy_pass http://localhost:9113/metrics;
      }
  
      location /nginx_status {
         	stub_status;
         	allow 127.0.0.1;
         	deny all;	
      }

      location /health {
        add_header Content-Type text/plain;
        return 200 'OK';
        access_log off;
        log_not_found off;
      }
}